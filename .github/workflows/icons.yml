name: Make app icons
on:
  push:
    branches: [main]
    paths: ['tools/icon.html', 'tools/icons.js', '.github/workflows/icons.yml']
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node tools/icons.js && ls -la *.png
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-*.png
          git diff --cached --quiet || (git commit -m "Update app icons" && git push)
