name: Real 3D screenshots
on:
  push:
    branches: [main]
    paths: ['index.html', 'tools/shots.js', '.github/workflows/screenshots.yml']
  workflow_dispatch: {}
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: (python3 -m http.server 8080 >/dev/null 2>&1 &) && sleep 1 && node tools/shots.js
      - uses: actions/upload-artifact@v4
        with: {name: screenshots, path: shots/, retention-days: 14}
