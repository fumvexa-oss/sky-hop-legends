<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0}
.ic{width:512px;height:512px;position:relative;overflow:hidden;background:linear-gradient(#5db8ff,#bfe6ff)}
.safe{position:absolute;inset:0;transform:scale(var(--k,1));transform-origin:50% 50%}
.cloud{position:absolute;background:#fff;border-radius:40px}
.head{position:absolute;left:146px;top:150px;width:220px;height:220px;background:#ffd9a8;border:12px solid #1d2b53;border-radius:28px;box-sizing:border-box}
.eye{position:absolute;top:70px;width:30px;height:44px;background:#1d2b53;border-radius:6px}
.smile{position:absolute;left:62px;top:140px;width:72px;height:18px;background:#1d2b53;border-radius:0 0 18px 18px}
.cheek{position:absolute;top:122px;width:26px;height:16px;background:#ff9fb9;border-radius:8px}
.cap{position:absolute;left:134px;top:102px;width:244px;height:78px;background:#ff5d8f;border:12px solid #1d2b53;border-radius:22px 22px 8px 8px;box-sizing:border-box}
.brim{position:absolute;left:250px;top:152px;width:150px;height:34px;background:#ff5d8f;border:12px solid #1d2b53;border-radius:8px 18px 18px 8px;box-sizing:border-box}
.coin{position:absolute;left:356px;top:62px;width:96px;height:96px;background:#ffd23f;border:12px solid #1d2b53;border-radius:50%;box-sizing:border-box}
.coin:after{content:"";position:absolute;left:26px;top:14px;width:20px;height:44px;background:#fff6c4;border-radius:10px}
.body{position:absolute;left:176px;top:378px;width:160px;height:150px;background:#3d8bff;border:12px solid #1d2b53;border-radius:20px;box-sizing:border-box}
</style></head><body>
<div class="ic" id="ic"><div class="safe">
 <div class="cloud" style="left:-40px;top:400px;width:260px;height:120px"></div>
 <div class="cloud" style="left:300px;top:420px;width:280px;height:110px"></div>
 <div class="cloud" style="left:30px;top:70px;width:120px;height:46px;opacity:.85"></div>
 <div class="body"></div>
 <div class="head"><div class="eye" style="left:52px"></div><div class="eye" style="left:118px"></div><div class="cheek" style="left:24px"></div><div class="cheek" style="left:146px"></div><div class="smile"></div></div>
 <div class="cap"></div><div class="brim"></div>
 <div class="coin"></div>
</div></div></body></html>
